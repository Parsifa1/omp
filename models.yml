providers:
  axonhub:
    baseUrl: https://api.cloudti.de/v1
    api: openai-completions
    apiKey: AXONHUB_API_KEY
    headers:
      User-Agent: claude-cli/2.1.158 (external, cli)
      Accept: application/json
    models:
