startup:
  checkUpdate: false
theme:
  dark: everforest
symbolPreset: nerd
statusLine:
  preset: custom
  separator: none
  sessionAccent: false
  leftSegments:
    - path
    - git
  rightSegments:
    - model
    - context_pct
    - token_total
    - subagents
  segmentOptions:
    model: null
    path:
      abbreviate: true
      maxLength: 48
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: false
      showUnstaged: false
      showUntracked: false
  showHookStatus: true
showHardwareCursor: true
modelRoles:
  default: axonhub/glm-5.2
  designer: axonhub/gemini-3.1-pro-preview
  vision: axonhub/gemini-3.1-pro-preview
  smol: axonhub/gpt-5.4-mini
  commit: axonhub/gpt-5.4-mini
  review: axonhub/gpt-5.5
  plan: axonhub/gpt-5.5
  slow: axonhub/claude-opus-4-8
browser:
  headless: true
secrets:
  enabled: true
edit:
  mode: hashline
lsp:
  diagnosticsOnEdit: true
hideThinkingBlock: false
contextPromotion:
  enabled: false
compaction:
  enabled: true
  thresholdPercent: 85
  strategy: snapcompact
  remoteEnabled: true
  handoffSaveToDisk: false
  supersedeReads: true
retry:
  maxRetries: 5
memories:
  enabled: true
branchSummary:
  enabled: true
collapseChangelog: true
renderMermaid:
  enabled: true
inspect_image:
  enabled: true
calc:
  enabled: true
async:
  enabled: true
task:
  isolation:
    mode: auto
    commits: generic
  eager: default
  showResolvedModelBadge: true
commands:
  enableClaudeUser: false
  enableClaudeProject: false
bashInterceptor:
  enabled: true
read:
  defaultLimit: 300
disabledExtensions:
  - skill:opencode-skill-install-flow
  - slash-command:copilot-stats
  - skill:mcp-builder
  - skill:skill-creator
  - skill:slack-gif-creator
checkpoint:
  enabled: false
tools:
  intentTracing: true
ttsr:
  contextMode: discard
  repeatMode: after-gap
  repeatGap: 5
todo:
  reminders: true
  remindersMax: 5
  eager: default
mcp:
  notifications: true
providers:
  webSearch: exa
memory:
  backend: mnemopi
disabledProviders:
  - opencode
  - llama.cpp
  - lm-studio
  - ollama
ask:
  timeout: 0
autocompleteMaxVisible: 7
github:
  enabled: true
bash:
  autoBackground:
    enabled: true
clearOnShrink: false
setupVersion: 1
mnemopi:
  scoping: per-project-tagged
defaultThinkingLevel: auto
dev:
  autoqa: false
