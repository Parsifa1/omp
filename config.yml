startup:
  checkUpdate: false
  changelogMode: summary
theme:
  dark: everforest
symbolPreset: nerd
composer:
  shape: pi
statusLine:
  preset: custom
  separator: none
  sessionAccent: false
  leftSegments:
    - path
    - git
  rightSegments:
    - model
    - context_pct
    - token_total
    - subagents
  segmentOptions:
    model: null
    path:
      abbreviate: true
      maxLength: 48
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: false
      showUnstaged: false
      showUntracked: false
  showHookStatus: true
showHardwareCursor: true
modelRoles:
  default: axonhub/glm-5.3:xhigh
  designer: axonhub/gemini-3.8-flash
  vision: axonhub/gemini-3.8-flash
  smol: axonhub/deepseek-flash
  commit: axonhub/deepseek-flash
  review: axonhub/gpt-5.6-sol
  plan: axonhub/gpt-5.6-terra
  slow: axonhub/claude-opus-4-8
browser:
  headless: false
secrets:
  enabled: true
edit:
  mode: hashline
lsp:
  diagnosticsOnEdit: true
hideThinkingBlock: false
contextPromotion:
  enabled: false
compaction:
  enabled: true
  thresholdPercent: 85
  handoffSaveToDisk: false
  supersedeReads: true
  methodOrder:
    - snapcompact
    - remote
    - soft
retry:
  maxRetries: 5
memories:
  enabled: true
branchSummary:
  enabled: true
renderMermaid:
  enabled: true
calc:
  enabled: true
async:
  enabled: true
task:
  isolation:
    commits: generic
    enabled: true
  eager: default
  showResolvedModelBadge: true
commands:
  enableClaudeUser: false
  enableClaudeProject: false
bashInterceptor:
  enabled: true
  patterns:
    - pattern: ^\s*npx\s+
      tool: bash
      message: "Project rule: use pnpm for everything Node. Use `pnpx <cmd>` instead of npx (pnpm dlx only for one-off temp runs)."
read:
  defaultLimit: 300
disabledExtensions:
  - skill:opencode-skill-install-flow
  - slash-command:copilot-stats
  - skill:mcp-builder
  - skill:skill-creator
  - skill:slack-gif-creator
checkpoint:
  enabled: false
tools:
  intentTracing: true
ttsr:
  contextMode: discard
  repeatMode: after-gap
  repeatGap: 5
todo:
  reminders: true
  remindersMax: 5
  eager: default
mcp:
  notifications: true
memory:
  backend: mnemopi
disabledProviders:
  - opencode
  - llama.cpp
  - lm-studio
  - ollama
ask:
  timeout: 0
autocompleteMaxVisible: 7
github:
  enabled: true
bash:
  autoBackground:
    enabled: true
clearOnShrink: false
setupVersion: 2
mnemopi:
  scoping: per-project-tagged
defaultThinkingLevel: auto
dev:
  autoqa: false
isolation:
  backend: auto