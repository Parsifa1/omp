startup:
  checkUpdate: false
theme:
  dark: everforest
symbolPreset: nerd
composer:
  shape: pi
statusLine:
  preset: custom
  separator: none
  sessionAccent: false
  leftSegments:
    - path
    - git
  rightSegments:
    - model
    - context_pct
    - token_total
    - subagents
  segmentOptions:
    path:
      maxLength: 48
    git:
      showStaged: false
      showUnstaged: false
      showUntracked: false
modelRoles:
  default: magpie/antigravity/gemini-3.8-flash
  designer: magpie/antigravity/gemini-3.8-flash
  vision: magpie/deepseek/deepseek-flash
  smol: magpie/group/glm-5.3:max
  commit: magpie/deepseek/deepseek-flash
  review: magpie/venlacy/gpt-6.1-sol
  plan: magpie/venlacy/gpt-6-astra
  slow: magpie/venlacy/gpt-6-astra
  judge: typesafe/jev-latest
secrets:
  enabled: true
lsp:
  diagnosticsOnEdit: true
compaction:
  thresholdPercent: 80
  methodOrder:
    - remote
    - snapcompact
    - soft
  idleEnabled: true
retry:
  maxRetries: 5
memories:
  enabled: true
branchSummary:
  enabled: true
task:
  isolation:
    enabled: true
  showResolvedModelBadge: true
commands:
  enableClaudeProject: false
disabledExtensions:
  - skill:opencode-skill-install-flow
  - slash-command:copilot-stats
  - skill:mcp-builder
  - skill:skill-creator
  - skill:slack-gif-creator
  - extension-module:claude-metadata-device-id
  - extension-module:axonhub-trace
  - extension-module:skill-mcp
ttsr:
  repeatMode: after-gap
  repeatGap: 5
todo:
  remindersMax: 5
mcp:
  notifications: true
memory:
  backend: mnemopi
disabledProviders:
  - opencode
  - llama.cpp
  - lm-studio
  - ollama
  - local
autocompleteMaxVisible: 7
github:
  enabled: true
setupVersion: 2
mnemopi:
  scoping: per-project-tagged
  embeddingVariant: multilingual
defaultThinkingLevel: auto
dev:
  autoqa: false
worktree:
  onExit: remove